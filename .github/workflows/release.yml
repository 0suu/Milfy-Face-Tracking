name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, 1.1.1)"
        required: true
        type: string

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required repository variable has been created for the Package
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    if: needs.config.outputs.config_package == 'true'
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Configure the Environment Variables needed for releasing the Package.
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ inputs.version }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ inputs.version }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ inputs.version }}" >> $GITHUB_ENV

      # The release version is selected in workflow_dispatch. Update only the
      # runner checkout so the package manifest inside the release artifact
      # matches the VPM version without changing the repository file.
      - name: Set Package Release Version
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PATH: ${{ env.packagePath }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          package_path = Path(os.environ["PACKAGE_PATH"]) / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = os.environ["VERSION"]
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .

      # Calculate the checksum that will be published to the VPM repository.
      - name: Compute Package SHA-256
        id: package_sha
        run: |
          set -euo pipefail
          sha256="$(sha256sum \"${{ env.zipFile }}\" | cut -d ' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "ZIP_SHA256=${sha256}" >> "$GITHUB_ENV"
      
      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}

      # Ask the suu-home repository to update its VPM index. The receiving
      # workflow verifies the release zip and commits only the VPM metadata.
      - name: Dispatch VPM update
        env:
          DISPATCH_TOKEN: ${{ secrets.SUU_HOME_DISPATCH_TOKEN }}
          VERSION: ${{ env.version }}
          ZIP_FILE: ${{ env.zipFile }}
          ZIP_SHA256: ${{ steps.package_sha.outputs.sha256 }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
        run: |
          set -euo pipefail
          test -n "${DISPATCH_TOKEN}"
          release_url="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIP_FILE}"
          payload="$(jq -n \
            --arg package_name "${PACKAGE_NAME}" \
            --arg version "${VERSION}" \
            --arg release_url "${release_url}" \
            --arg zip_sha256 "${ZIP_SHA256}" \
            '{event_type:"milfy-face-tracking-release",client_payload:{package_name:$package_name,version:$version,release_url:$release_url,zip_sha256:$zip_sha256}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/0suu/suu-home/dispatches \
            -d "${payload}"
